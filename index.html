<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dieta Disociada</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>Dieta Disociada</h1>
    <nav class="main-nav" id="main-nav"></nav>
  </header>

  <main class="app-main">
    <section id="view-hoy" class="view"></section>
    <section id="view-plan" class="view" hidden></section>
    <section id="view-compra" class="view" hidden></section>
    <section id="view-alimentos" class="view" hidden></section>
    <section id="view-buscador" class="view" hidden></section>
    <section id="view-recetas" class="view" hidden></section>
    <section id="view-progreso" class="view" hidden></section>
    <section id="view-recordatorios" class="view" hidden></section>
    <section id="view-notas" class="view" hidden></section>
  </main>

  <footer class="app-footer">
    <small>App de gestión de la dieta disociada. Datos guardados localmente en este dispositivo.</small>
  </footer>

  <script src="js/dieta-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
